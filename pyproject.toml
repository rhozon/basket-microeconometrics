[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basket-microeconometrics"
version = "0.1.0"
description = "Market basket analysis with microeconometrics on The Complete Journey: what lift measures, whether promotions move complements, and a basket-completion recommender tested out of time."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Hermont Ozon" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bmx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
